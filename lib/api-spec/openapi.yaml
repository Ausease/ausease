openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: assistant
    description: Store operations assistant
  - name: enterprise
    description: Enterprise access and provisioning
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /assistant:
    post:
      operationId: askOperationsAssistant
      tags: [assistant]
      summary: Understand and execute a natural-language store request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantRequest"
      responses:
        "200":
          description: Assistant response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantResponse"
  /assistant/transcribe:
    post:
      operationId: transcribeAssistantVoice
      tags: [assistant]
      summary: Transcribe a recorded manager voice request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscriptionRequest"
      responses:
        "200":
          description: Transcript
          content:
            application/json:
              schema:
                type: object
                required: [transcript]
                properties:
                  transcript: { type: string }
        "400": { description: Invalid audio payload }
        "413": { description: Recording too large }
        "415": { description: Unsupported audio format }
        "429": { description: Too many transcription attempts }
        "502": { description: Speech provider could not transcribe the recording }
        "503": { description: Speech service is not configured }
  /me:
    get:
      operationId: getEnterpriseProfile
      tags: [enterprise]
      summary: Return the authenticated user's enterprise access context
      responses:
        "200":
          description: Enterprise access context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnterpriseProfile"
        "401": { description: Authentication required }
        "403": { description: Organization or store assignment required }
  /admin/provisioning:
    get:
      operationId: getEnterpriseProvisioning
      tags: [enterprise]
      summary: Return stores, domains, and memberships for headquarters administrators
      responses:
        "200":
          description: Provisioning data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnterpriseProvisioning" }
        "403": { description: Headquarters administrator access required }
  /checklists:
    get:
      operationId: getPublishedChecklists
      tags: [enterprise]
      summary: Return published checklists assigned to the current store and role
      responses:
        "200":
          description: Published checklist standards
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublishedChecklistResponse" }
  /checklists/{checklistId}/progress:
    put:
      operationId: updateChecklistProgress
      tags: [enterprise]
      summary: Record the current user's progress against an assigned published checklist version
      parameters:
        - { name: checklistId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChecklistProgressInput" }
      responses:
        "200":
          description: Checklist step progress recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChecklistProgressResponse" }
        "400": { description: Invalid progress update }
        "403": { description: Checklist access or assignment required }
        "404": { description: Assigned checklist version or item not found }
  /admin/checklists:
    get:
      operationId: getAdminChecklists
      tags: [enterprise]
      summary: Return checklist templates, versions, and assignments for headquarters administrators
      responses:
        "200":
          description: Checklist management data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminChecklistResponse" }
        "403": { description: Headquarters administrator access required }
    post:
      operationId: createChecklistTemplate
      tags: [enterprise]
      summary: Create a checklist template and its first draft version
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChecklistInput" }
      responses:
        "201":
          description: Checklist draft created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminChecklistTemplate" }
        "400": { description: Invalid checklist }
  /admin/checklists/{checklistId}/versions:
    post:
      operationId: createChecklistVersion
      tags: [enterprise]
      summary: Create an immutable draft version of a checklist template
      parameters:
        - { name: checklistId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChecklistVersionInput" }
      responses:
        "201":
          description: Checklist version created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminChecklistTemplate" }
        "400": { description: Invalid checklist }
        "404": { description: Checklist template not found }
  /admin/checklists/{checklistId}/versions/{versionId}/publish:
    post:
      operationId: publishChecklistVersion
      tags: [enterprise]
      summary: Publish a checklist version to selected stores and roles
      parameters:
        - { name: checklistId, in: path, required: true, schema: { type: string } }
        - { name: versionId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChecklistPublishInput" }
      responses:
        "200":
          description: Checklist version published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChecklistVersion" }
        "400": { description: "Invalid stores, roles, or effective date" }
        "409": { description: Published versions are immutable }
        "404": { description: Checklist version not found }
  /admin/domains:
    post:
      operationId: addEnterpriseDomain
      tags: [enterprise]
      summary: Add a company domain and its SSO provider mapping
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnterpriseDomainInput" }
      responses:
        "201":
          description: Domain mapping created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnterpriseDomain" }
  /admin/domains/{domainId}:
    patch:
      operationId: updateEnterpriseDomain
      tags: [enterprise]
      summary: Update a company domain mapping without accepting provider secrets
      parameters:
        - { name: domainId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnterpriseDomainUpdate" }
      responses:
        "200":
          description: Domain mapping updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnterpriseDomain" }
  /admin/domains/{domainId}/credentials:
    post:
      operationId: configureEnterpriseDomainCredentials
      tags: [enterprise]
      summary: Configure a provider using a workspace secret reference
      description: The server verifies the named workspace secret without accepting or returning its value.
      parameters:
        - { name: domainId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnterpriseCredentialInput" }
      responses:
        "200":
          description: Provider credentials configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnterpriseDomain" }
        "400": { description: Invalid workspace secret key reference }
        "404": { description: Domain mapping not found }
        "422": { description: Workspace secret is unavailable or failed validation }
  /admin/stores:
    post:
      operationId: addEnterpriseStore
      tags: [enterprise]
      summary: Add a store to the current organization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnterpriseStoreInput" }
      responses:
        "201":
          description: Store created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnterpriseStore" }
  /admin/stores/{storeId}:
    patch:
      operationId: updateEnterpriseStoreGeofence
      tags: [enterprise]
      summary: Configure a store geofence
      parameters:
        - { name: storeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnterpriseStoreGeofenceInput" }
      responses:
        "200":
          description: Store geofence updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnterpriseStore" }
        "400": { description: Invalid coordinates or radius }
        "404": { description: Store not found }
  /admin/memberships:
    post:
      operationId: inviteEnterpriseMember
      tags: [enterprise]
      summary: Invite a user and assign an initial store and role
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnterpriseMembershipInput" }
      responses:
        "201":
          description: Membership invitation created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnterpriseMembership" }
  /admin/memberships/{membershipId}:
    patch:
      operationId: updateEnterpriseMembership
      tags: [enterprise]
      summary: Change a user's store, role, or access status
      parameters:
        - { name: membershipId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnterpriseMembershipUpdate" }
      responses:
        "200":
          description: Membership updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnterpriseMembership" }
  /audit:
    get:
      operationId: getEnterpriseAudit
      tags: [enterprise]
      summary: Return recent audit events for the current store
      responses:
        "200":
          description: Recent audit events
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEvent" }
        "401": { description: Authentication required }
        "403": { description: "Manager, reviewer, or headquarters role required" }
  /operations/snapshot:
    get:
      operationId: getOperationsSnapshot
      tags: [enterprise]
      summary: Return the current store operations snapshot
      responses:
        "200":
          description: Store operations snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationsSnapshot" }
        "401": { description: Authentication required }
    put:
      operationId: saveOperationsSnapshot
      tags: [enterprise]
      summary: Save the current store operations snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperationsSnapshot" }
      responses:
        "200":
          description: Saved store operations snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationsSnapshot" }
        "401": { description: Authentication required }
        "403": { description: "The current role cannot update operations" }
  /operations/records/{kind}/{recordId}:
    put:
      operationId: updateOperationsRecord
      tags: [enterprise]
      summary: Update one operations record with optimistic concurrency
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [task, issue, message] } }
        - { name: recordId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperationsRecordUpdate" }
      responses:
        "200":
          description: Accepted operations record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationsRecord" }
        "400": { description: Invalid record }
        "401": { description: Authentication required }
        "403": { description: The current role cannot update operations }
        "409":
          description: Optimistic concurrency conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationsConflict" }
  /presence/status:
    get:
      operationId: getPresenceStatus
      tags: [enterprise]
      summary: Return current store and manager presence status
      responses:
        "200":
          description: Presence and checklist access status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresenceStatus" }
        "403": { description: Active store membership required }
  /presence/check-in:
    post:
      operationId: checkInToStore
      tags: [enterprise]
      summary: Check in from inside the assigned store
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PresenceCheckInInput" }
      responses:
        "200":
          description: Store presence recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresenceCheckInResponse" }
        "400": { description: Invalid location }
        "403": { description: Outside the configured store geofence }
        "409": { description: Store geofence not configured }
  /routines/today:
    get:
      operationId: getTodayRoutines
      tags: [enterprise]
      summary: Return today's Start of Day and End of Day routines
      responses:
        "200":
          description: Daily operating routines
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TodayRoutinesResponse" }
  /routines/{routineId}/complete:
    post:
      operationId: completeRoutine
      tags: [enterprise]
      summary: Complete a daily operating routine
      parameters:
        - { name: routineId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoutineCompletionInput" }
      responses:
        "200":
          description: Routine completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutineInstance" }
        "422": { description: Required evidence is missing }
  /routines/{routineId}/evidence/upload-url:
    post:
      operationId: requestRoutineEvidenceUploadUrl
      tags: [enterprise]
      summary: Request a signed upload URL for routine evidence
      parameters:
        - { name: routineId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoutineEvidenceUploadInput" }
      responses:
        "200":
          description: Signed object upload URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutineEvidenceUploadResponse" }
  /routines/{routineId}/evidence:
    post:
      operationId: registerRoutineEvidence
      tags: [enterprise]
      summary: Register an uploaded routine evidence object
      parameters:
        - { name: routineId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoutineEvidenceRegisterInput" }
      responses:
        "201":
          description: Evidence registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoutineEvidence" }
  /corrective-actions:
    post:
      operationId: createCorrectiveAction
      tags: [enterprise]
      summary: Create a manager-owned corrective action
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CorrectiveActionInput" }
      responses:
        "201":
          description: Corrective action created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CorrectiveAction" }
  /corrective-actions/{actionId}:
    patch:
      operationId: updateCorrectiveAction
      tags: [enterprise]
      summary: Update a corrective action status
      parameters:
        - { name: actionId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [open, completed] }
      responses:
        "200":
          description: Corrective action updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CorrectiveAction" }
  /operations/command-center:
    get:
      operationId: getOperationsCommandCenter
      tags: [enterprise]
      summary: Return manager and headquarters operations summary
      responses:
        "200":
          description: Exception-driven operations summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandCenterResponse" }
  /checklists/access:
    get:
      operationId: getChecklistAccess
      tags: [enterprise]
      summary: Check whether the current user may open a checklist
      parameters:
        - { name: checklistId, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: Checklist access is available
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresenceStatus" }
        "403":
          description: Checklist access is blocked by presence requirements
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresenceStatus" }
  /checklists/{checklistId}/open:
    post:
      operationId: openChecklist
      tags: [enterprise]
      summary: Open a checklist after validating store presence
      parameters:
        - { name: checklistId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Checklist opened, content: { application/json: { schema: { $ref: "#/components/schemas/ChecklistAccessResponse" } } } }
        "403": { description: Presence requirements not met, content: { application/json: { schema: { $ref: "#/components/schemas/ChecklistAccessResponse" } } } }
  /checklists/{checklistId}/submit:
    post:
      operationId: submitChecklist
      tags: [enterprise]
      summary: Submit a checklist after validating store presence
      parameters:
        - { name: checklistId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Checklist submitted, content: { application/json: { schema: { $ref: "#/components/schemas/ChecklistSubmitResponse" } } } }
        "403": { description: Presence requirements not met, content: { application/json: { schema: { $ref: "#/components/schemas/ChecklistAccessResponse" } } } }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AssistantTask:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        area: { type: string }
        due: { type: string }
        done: { type: boolean }
        priority: { type: string, enum: [high, normal] }
        assignee: { type: string }
      required: [id, title, area, due, done]
    AssistantIssue:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        area: { type: string }
        status: { type: string, enum: [Open, In progress, Resolved] }
        time: { type: string }
        urgent: { type: boolean }
      required: [id, title, area, status, time]
    AssistantRequest:
      type: object
      properties:
        request: { type: string, minLength: 1 }
        confirmed: { type: boolean }
        tasks:
          type: array
          items: { $ref: "#/components/schemas/AssistantTask" }
        issues:
          type: array
          items: { $ref: "#/components/schemas/AssistantIssue" }
      required: [request]
    AssistantResponse:
      type: object
      properties:
        message: { type: string }
        intent: { type: string, enum: [answer, create_task, summarize_issues, operations_summary, sop_guidance, clarify] }
        confirmationRequired: { type: boolean }
        task:
          anyOf:
            - { $ref: "#/components/schemas/AssistantTask" }
            - { type: "null" }
        mentions:
          type: array
          items: { type: string }
        auditId: { type: string }
      required: [message, intent, confirmationRequired, mentions, auditId]
    TranscriptionRequest:
      type: object
      required: [audioBase64]
      properties:
        audioBase64: { type: string, format: byte, maxLength: 12000000 }
        mimeType:
          type: string
          description: MIME type of the recorded audio
          enum: [audio/aac, audio/flac, audio/m4a, audio/mp4, audio/mpeg, audio/mp3, audio/ogg, audio/wav, audio/x-wav, audio/webm]
    EnterpriseProfile:
      type: object
      required: [access, userId, organization, store, role]
      properties:
        access: { type: string, enum: [active, invitation_required, disabled, unassigned] }
        userId: { type: string }
        organization:
          anyOf:
            - { $ref: "#/components/schemas/EnterpriseOrganization" }
            - { type: "null" }
        store:
          anyOf:
            - { $ref: "#/components/schemas/EnterpriseStore" }
            - { type: "null" }
        role: { type: string, enum: [employee, manager, reviewer, hq_admin] }
    EnterpriseOrganization:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    EnterpriseStore:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        geofenceRadiusMeters: { type: number }
        geofenceEnabled: { type: boolean }
    EnterpriseStoreGeofenceInput:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        geofenceRadiusMeters: { type: number, minimum: 25, maximum: 2000 }
        geofenceEnabled: { type: boolean }
    EnterpriseDomain:
      type: object
      required: [id, organizationId, domain, providerType, providerName, secretConfigured, credentialStatus, credentialVersion, enabled, updatedAt]
      properties:
        id: { type: string }
        organizationId: { type: string }
        domain: { type: string }
        providerType: { type: string, enum: [saml, oidc, oauth] }
        providerName: { type: string }
        issuerUrl: { type: string, nullable: true }
        clientId: { type: string, nullable: true }
        secretConfigured: { type: boolean, description: "Whether the server-side workspace secret is configured; the secret itself is never sent to the client." }
        credentialStatus: { type: string, enum: [not_configured, configured, error] }
        credentialValidationError: { type: string, nullable: true }
        credentialVersion: { type: integer }
        credentialRotatedAt: { type: string, format: date-time, nullable: true }
        enabled: { type: boolean }
        updatedAt: { type: string, format: date-time }
    EnterpriseMembership:
      type: object
      required: [id, organizationId, storeId, clerkUserId, role, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        organizationId: { type: string }
        storeId: { type: string }
        clerkUserId: { type: string }
        email: { type: string, nullable: true }
        role: { type: string, enum: [employee, manager, reviewer, hq_admin] }
        status: { type: string, enum: [active, invited, disabled] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EnterpriseDomainInput:
      type: object
      required: [domain, providerName]
      properties:
        domain: { type: string }
        providerType: { type: string, enum: [saml, oidc, oauth] }
        providerName: { type: string }
        issuerUrl: { type: string }
        clientId: { type: string }
        secretConfigured: { type: boolean, description: "Deprecated and ignored. Configure credentials through the secure server-side flow." }
    EnterpriseDomainUpdate:
      type: object
      properties:
        providerName: { type: string }
        issuerUrl: { type: string, nullable: true }
        clientId: { type: string, nullable: true }
        enabled: { type: boolean }
        secretConfigured: { type: boolean, description: "Deprecated and ignored. Configure credentials through the secure server-side flow." }
    EnterpriseCredentialInput:
      type: object
      required: [secretKey]
      properties:
        secretKey:
          type: string
          pattern: "^[A-Z][A-Z0-9_]{2,127}$"
          description: Name of a workspace secret. Its value is resolved only by the server.
    EnterpriseMembershipInput:
      type: object
      required: [email, storeId]
      properties:
        email: { type: string }
        clerkUserId: { type: string }
        storeId: { type: string }
        role: { type: string, enum: [employee, manager, reviewer, hq_admin] }
    EnterpriseStoreInput:
      type: object
      required: [name]
      properties:
        id: { type: string }
        name: { type: string }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        geofenceRadiusMeters: { type: number, minimum: 25, maximum: 2000 }
    EnterpriseMembershipUpdate:
      type: object
      properties:
        storeId: { type: string }
        role: { type: string, enum: [employee, manager, reviewer, hq_admin] }
        status: { type: string, enum: [active, invited, disabled] }
    EnterpriseProvisioning:
      type: object
      required: [domains, stores, memberships]
      properties:
        domains:
          type: array
          items: { $ref: "#/components/schemas/EnterpriseDomain" }
        stores:
          type: array
          items: { $ref: "#/components/schemas/EnterpriseStore" }
        memberships:
          type: array
          items: { $ref: "#/components/schemas/EnterpriseMembership" }
